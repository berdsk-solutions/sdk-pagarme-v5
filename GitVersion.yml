next-version: 1.0.1
mode: ContinuousDelivery
branches:
  main:
    regex: ^main$
    tag: ""
    increment: Patch
    is-release-branch: true
    source-branches: ['develop']
  develop:
    regex: ^develop$
    tag: alpha
    increment: Minor
    is-release-branch: false
    source-branches: ['main']
ignore:
  sha: []