name: Publish to NuGet

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3
        id: gitversion
        with:
          useConfigFile: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          # Captura a versão semVer do output da action
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.0-preview"; fi
          echo "Building version: $VERSION"
          dotnet build --configuration Release --no-restore /p:Version="$VERSION"

      - name: Test
        if: github.ref == 'refs/heads/develop'
        env:
          PAGARME_SECRET_KEY: ${{ secrets.PAGARME_SECRET_KEY }}
          PAGARME_BASE_URL: "https://api.pagar.me/core/v5/"
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.0-preview"; fi
          dotnet pack --configuration Release --no-build --output ./nupkg /p:Version="$VERSION"

      - name: Push to NuGet.org
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if [ ! -z "$VERSION" ]; then
            dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "Skipping push: Version not found."
          fi

      - name: Tag release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if [ -z "$VERSION" ]; then
            echo "Skipping tag: Version not found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Push to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GH_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GH_TOKEN }} --source github --skip-duplicate